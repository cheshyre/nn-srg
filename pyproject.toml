[project]
name = "nn-srg"
version = "0.1.0"
description = "Python package to perform similarity renormalization group evolution of nucleon-nucleon potentials"
authors = [
    {name = "Matthias Heinz",email = "heinzmc@ornl.gov"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
